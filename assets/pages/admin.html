<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <link rel="stylesheet" href="../css/style.css">

<body style="
font-family: Arial, sans-serif;
background: var(--pastelrosado);
padding: 20px;
">

<div style="
max-width: 1000px;
margin: auto;
background: var(--blanco);
padding: 25px;
border-radius: 15px;
box-shadow: 0 0 15px rgba(185,39,112,0.2);
">

    <h1 style="
    text-align:center;
    color: var(--rosado);
    margin-bottom:20px;
    ">
        🌸 Panel Administrador
    </h1>

    <div style="
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
    ">

        <button
        onclick="location.href='./admin-productos.html'"
        style="
        background:var(--rosado);
        color:white;
        border:none;
        padding:12px 20px;
        border-radius:8px;
        cursor:pointer;
        ">
            📦 Agregar Productos
        </button>

        <button
        onclick="location.href='./admin-empleados.html'"
        style="
        background:var(--rosado);
        color:white;
        border:none;
        padding:12px 20px;
        border-radius:8px;
        cursor:pointer;
        ">
            👥 Agregar Empleados
        </button>

        <button
        onclick="location.href='/index.html'"
        style="
        background:var(--gris);
        color:white;
        border:none;
        padding:12px 20px;
        border-radius:8px;
        cursor:pointer;
        ">
            🏠 Volver al Inicio
        </button>

    </div>

    <hr>

    <h2 style="color:var(--rosado);">
        📋 Pedidos
    </h2>

    <div id="listaPedidos"></div>

</div>

<script>

const usuario = localStorage.getItem("usuario");
const admin = localStorage.getItem("admin");

if (!usuario || admin !== "true") {

    alert("Acceso denegado");
    window.location.href = "/index.html";
}

async function cargarPedidos() {

    const res = await fetch(
        "https://webchavala2.onrender.com/ordenes"
    );

    const pedidos = await res.json();

    const lista = document.getElementById("listaPedidos");

    lista.innerHTML = "";

    pedidos.forEach(pedido => {

        lista.innerHTML += `
        <div style="
            border:1px solid var(--pastelrosado);
            border-radius:10px;
            padding:15px;
            margin-bottom:15px;
            background:#fff8fa;
        ">

            <h3 style="color:var(--rosado);">
                Proveedor:
                ${pedido.proveedorNombre}
            </h3>

            ${pedido.productos.map(p =>
                `<p>• ${p.nombre} - S/${p.precio}</p>`
            ).join("")}

        </div>
        `;
    });
}

cargarPedidos();

</script>

</body>
</html>
