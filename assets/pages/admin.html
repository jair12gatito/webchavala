<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
</head>

<body style="
font-family: Arial;
background:#f4f4f4;
padding:20px;
">

<div style="
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
">

    <h1 style="text-align:center;">
        Panel Administrador
    </h1>

    <div style="
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    ">

        <button onclick="location.href='./admin-productos.html'">
            📦 Agregar Productos
        </button>

        <button onclick="location.href='./admin-empleados.html'">
            👥 Agregar Empleados
        </button>

        <button onclick="location.href='/index.html'">
            🏠 Volver al Inicio
        </button>

    </div>

    <hr>

    <h2>📋 Pedidos</h2>

    <div id="listaPedidos"></div>

</div>

<script>

const usuario = localStorage.getItem("usuario");
const admin = localStorage.getItem("admin");

if (!usuario || admin !== "true") {

    alert("Acceso denegado");

    window.location.href = "/index.html";
}

async function cargarPedidos() {

    const res = await fetch(
        "https://webchavala2.onrender.com/ordenes"
    );

    const pedidos = await res.json();

    const lista = document.getElementById("listaPedidos");

    lista.innerHTML = "";

    pedidos.forEach(pedido => {

        lista.innerHTML += `
        <div style="
            border:1px solid #ddd;
            border-radius:10px;
            padding:15px;
            margin-bottom:10px;
            background:#fafafa;
        ">

            <h3>
                Proveedor:
                ${pedido.proveedorNombre}
            </h3>

            ${pedido.productos.map(p =>
                `<p>• ${p.nombre} - S/${p.precio}</p>`
            ).join("")}

        </div>
        `;
    });
}

cargarPedidos();

</script>

</body>

</html>
