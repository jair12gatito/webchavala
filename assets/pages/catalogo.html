    <script>

        let carrito = [];

        function agregarCarrito(nombre, precio, imagen) {

            carrito.push({
                nombre,
                precio,
                imagen
            });

            actualizarCarrito();

        }
        function actualizarCarrito() {

            const lista = document.getElementById("lista-carrito");

            const contador = document.getElementById("contador-carrito");

            const totalHTML = document.getElementById("total");

            lista.innerHTML = "";

            let total = 0;

            carrito.forEach((producto, index) => {

                total += producto.precio;

                lista.innerHTML += `
            <div class="item-carrito">

       <img src="${producto.imagen}" class="img-carrito" onerror="this.src='../img/pastel.jpg'">

        <div>
            <p>${producto.nombre}</p>
            <p>S/${producto.precio}</p>
        </div>

        <button onclick="eliminarProducto(${index})">
            X
        </button>

    </div>
        `;
            });

            contador.innerText = carrito.length;

            totalHTML.innerText = `Total: S/ ${total}`;
        }

        function eliminarProducto(index) {

            carrito.splice(index, 1);

            actualizarCarrito();
        }

        function abrirCarrito() {

            const carritoHTML = document.getElementById("carrito");

            carritoHTML.classList.toggle("mostrar-carrito");
        }
        async function finalizarCompra() {

            if (carrito.length === 0) {
                alert("El carrito está vacío");
                return;
            }

            const proveedor = document.getElementById("proveedorSelect").value;

            if (!proveedor) {
                alert("Selecciona un proveedor");
                return;
            }

            const orden = {
                proveedorNombre: proveedor,
                productos: carrito
            };

            try {

                const response = await fetch("https://webchavala2.onrender.com/ordenes/guardar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(orden)
                });

                const data = await response.json();

                alert("Orden guardada con éxito");

                carrito = [];
                actualizarCarrito();

            } catch (error) {
                console.log(error);
                alert("Error al guardar la orden");
            }
        }

    </script>

    <script>

        const usuario = localStorage.getItem("usuario");

        const loginBtn = document.querySelector('a[href="./register.html"]');
        const userText = document.getElementById("userText");
        const logoutBtn = document.getElementById("logoutBtn");

        if (usuario) {

            loginBtn.style.visibility = "hidden";

            userText.style.visibility = "visible";
            logoutBtn.style.visibility = "visible";

            userText.innerHTML = `
        <i class="fa-solid fa-user"></i>
        Hola ${usuario}
    `;
        }

        logoutBtn.addEventListener("click", () => {

            localStorage.removeItem("usuario");
            localStorage.removeItem("email");

            window.location.href = "/index.html";

        });


    </script>
    <script>

        async function cargarProductos() {

            const res = await fetch(
                "https://webchavala2.onrender.com/productos"
            );

            const productos = await res.json();

            const contenedor =
                document.getElementById("productosContainer");

            contenedor.innerHTML = "";

            productos.forEach(producto => {

                contenedor.innerHTML += `
    
    <div class="producto">

        <img src="${producto.imagen}"
             alt="${producto.nombre}">

        <h3>${producto.nombre}</h3>

        <p class="precio">
            S/${producto.precio}
        </p>

        <button onclick="
            agregarCarrito(
                '${producto.nombre}',
                ${producto.precio},
                '${producto.imagen}'
            )
        ">
            Agregar
        </button>

    </div>

    `;
            });
        }

        cargarProductos();

    </script>
