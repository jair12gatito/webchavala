<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ver Proveedores</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="admin-page">

    <div class="admin-container">

        <h1 class="admin-title">
            📦 Proveedores Registrados
        </h1>

        <div class="admin-menu">
            <button onclick="location.href='./admin.html'">
                ⬅ Volver al Panel
            </button>
        </div>

        <div class="empleado-card">

            <h2>➕ Agregar Proveedor</h2>

            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="ruc" placeholder="RUC" required>
            <input type="text" id="telefono" placeholder="Teléfono" required>
            <input type="text" id="direccion" placeholder="Dirección" required>

            <br><br>

            <button onclick="agregarProveedor()">
                Guardar Proveedor
            </button>

        </div>

        <br>

        <div id="listaProveedores"></div>

    </div>

<script>

const admin = localStorage.getItem("admin");

if(admin !== "true"){
    alert("Acceso denegado");
    window.location.href = "/index.html";
}

async function cargarProveedores(){

    try{

        const res = await fetch(
            "https://webchavala2.onrender.com/proveedores"
        );

        const proveedores = await res.json();

        const lista = document.getElementById("listaProveedores");

        lista.innerHTML = "";

        proveedores.forEach(p => {

            lista.innerHTML += `
            
            <div class="empleado-card">

                <h3>${p.nombre}</h3>

                <p><strong>RUC:</strong> ${p.ruc}</p>

                <p><strong>Teléfono:</strong> ${p.telefono}</p>

                <p><strong>Dirección:</strong> ${p.direccion}</p>

            </div>
            
            `;

        });

    }catch(error){

        console.error(error);
        alert("Error al cargar proveedores");

    }

}

async function agregarProveedor(){

    const nombre = document.getElementById("nombre").value.trim();
    const ruc = document.getElementById("ruc").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const direccion = document.getElementById("direccion").value.trim();

    if(!nombre || !ruc || !telefono || !direccion){
        alert("Completa todos los campos");
        return;
    }

    const proveedor = {
        nombre,
        ruc,
        telefono,
        direccion
    };

    try{

        const res = await fetch(
            "https://webchavala2.onrender.com/proveedores",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(proveedor)
            }
        );

        if(res.ok){

            alert("Proveedor agregado correctamente");

            document.getElementById("nombre").value = "";
            document.getElementById("ruc").value = "";
            document.getElementById("telefono").value = "";
            document.getElementById("direccion").value = "";

            cargarProveedores();

        }else{

            alert("No se pudo agregar el proveedor");

        }

    }catch(error){

        console.error(error);
        alert("Error de conexión");

    }

}

cargarProveedores();

</script>

</body>
</html>
